        from_state_id: state.temp-high
        to_state_id: state.protection-active
        basis_step_refs:
          - fwd-step-001
          - bwd-step-002

      - segment_id: thermal-segment-002
        from_state_id: state.protection-active
        to_state_id: state.service-throttled
        basis_step_refs:
          - fwd-step-002
          - bwd-step-001

    evidence_refs:
      - ev-001
      - ev-002
      - ev-003

    contradictions: []

    unresolved_gaps:
