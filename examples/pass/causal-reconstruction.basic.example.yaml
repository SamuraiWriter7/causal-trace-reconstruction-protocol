    confidence: 0.91
    status: active

  - hypothesis_id: hypothesis.workload-saturation

    statement: >
      The service may have been throttled primarily because of workload
      saturation rather than thermal protection.

    meeting_points: []

    candidate_path: []

    evidence_refs:
      - ev-003

    contradictions:
      - contradiction_id: contradiction-workload-001
